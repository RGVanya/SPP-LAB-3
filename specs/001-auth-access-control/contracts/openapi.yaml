openapi: 3.1.0
info:
  title: Менеджер задач — REST API (ЛР №2–3)
  version: 2.0.0
  description: |
    Аутентификация — временный ключ доступа (JWT, 15 мин) в `Authorization: Bearer`
    и ротируемый ключ обновления (7 дней) в cookie `refresh_token`
    (`HttpOnly; SameSite=Strict; Path=/api/auth`).
    Все ошибки — `application/problem+json`, см. `errors.md`.
    Каждый ответ содержит заголовок `X-Request-Id`.
servers:
  - url: http://localhost:3000/api

security:
  - bearer: []

tags:
  - name: auth
  - name: sessions
  - name: tasks
  - name: admin

paths:
  /health:
    get:
      security: []
      summary: Состояние сервиса и БД
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }
        '503': { $ref: '#/components/responses/Problem' }

  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Регистрация (роль viewer) и вход
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
      responses:
        '201':
          description: Пользователь создан, сеанс открыт
          headers:
            Location: { schema: { type: string, example: /api/auth/me } }
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Вход по e-mail и паролю
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '200':
          description: Сеанс открыт
          headers: { Set-Cookie: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Обмен ключа обновления на новую пару ключей (ротация)
      parameters:
        - { in: cookie, name: refresh_token, required: true, schema: { type: string } }
      responses:
        '200': { description: Новые ключи, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      security: []
      summary: Выход — завершает текущий сеанс, очищает cookie
      responses:
        '204': { description: Выполнено }

  /auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/forgot-password:
    post:
      tags: [auth]
      security: []
      summary: Запрос ссылки восстановления (ответ одинаков для любых e-mail)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Принято, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/reset-password:
    post:
      tags: [auth]
      security: []
      summary: Установка нового пароля по токену из письма
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8, maxLength: 128 } } } } }
      responses:
        '204': { description: Пароль изменён, все сеансы завершены }
        '422': { $ref: '#/components/responses/Problem' }

  /auth/sessions:
    get:
      tags: [sessions]
      summary: Мои активные сеансы
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { sessions: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } } }
    delete:
      tags: [sessions]
      summary: Завершить все мои сеансы, кроме текущего
      responses:
        '204': { description: Выполнено }

  /auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      summary: Завершить мой сеанс
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: Выполнено }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [tasks]
      summary: Список задач (viewer+)
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      summary: Создать задачу (editor+)
      responses:
        '201': { description: Создана, headers: { Location: { schema: { type: string, example: /api/tasks/{id} } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}:
    get: { tags: [tasks], summary: Задача (viewer+), responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Problem' } } }
    put: { tags: [tasks], summary: Изменить (editor+), responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } } }
    delete: { tags: [tasks], summary: Удалить (editor+), responses: { '204': { description: Удалена }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }

  /tasks/{id}/attachments:
    post:
      tags: [tasks]
      summary: Прикрепить файл, multipart/form-data, поле file (editor+)
      responses:
        '201': { description: Прикреплён, headers: { Location: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/attachments/{attachmentId}:
    delete: { tags: [tasks], summary: Удалить вложение (editor+), responses: { '204': { description: Удалено } } }

  /tasks/{id}/attachments/{attachmentId}/download:
    get: { tags: [tasks], summary: Скачать вложение (viewer+), responses: { '200': { description: Файл } } }

  /admin/users:
    get:
      tags: [admin]
      summary: Пользователи (admin)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { users: { type: array, items: { $ref: '#/components/schemas/User' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}:
    patch:
      tags: [admin]
      summary: Сменить роль (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } } } } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/sessions:
    get:
      tags: [admin]
      summary: Активные сеансы всех пользователей (admin)
      responses:
        '200': { description: OK }

  /admin/sessions/{sessionId}:
    delete:
      tags: [admin]
      summary: Принудительно завершить сеанс (admin)
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: Выполнено }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    SessionId: { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }

  responses:
    Problem:
      description: Ошибка (RFC 9457)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooMany:
      description: Слишком много попыток
      headers: { Retry-After: { schema: { type: integer, description: секунды } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Role: { type: string, enum: [viewer, editor, admin] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        activeSessions: { type: integer, description: только в /admin/users }
    RegisterInput:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        tokenType: { const: Bearer }
        expiresIn: { type: integer, description: секунды, example: 900 }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string }
        ip: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
        user: { $ref: '#/components/schemas/User', description: только в /admin/sessions }
    Problem:
      type: object
      required: [type, title, status, detail, instance, requestId]
      properties:
        type: { type: string, example: /problems/validation-error }
        title: { type: string, example: Unprocessable Content }
        status: { type: integer, example: 422 }
        detail: { type: string, example: Проверьте введённые данные }
        instance: { type: string, example: /api/tasks }
        requestId: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        retryAfter: { type: integer }
        attemptsLeft: { type: integer }
        requiredRole: { $ref: '#/components/schemas/Role' }
